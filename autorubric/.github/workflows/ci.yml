name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autorubric
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          pip install hatchling pytest-cov
          pip install .[extraction,nlp,ml,audit]
          pip install pytest httpx pytest-asyncio
      - name: Run Ruff (lint)
        run: cd backend && ruff check src tests
      - name: Run Ruff (format)
        run: cd backend && ruff format --check src tests
      - name: Run mypy
        run: cd backend && mypy src
      - name: Run pytest with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/autorubric
          REDIS_URL: redis://localhost:6379/0
        run: cd backend && pytest --cov=autorubric.scorer --cov=autorubric.core --cov-fail-under=85
