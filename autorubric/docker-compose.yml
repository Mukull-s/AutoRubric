version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: ../deploy/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/autorubric
      - REDIS_URL=redis://redis:6379/0
      - ADMIN_USER=admin
      - ADMIN_PASS=admin
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend/src:/app/src
      - ./models:/app/models
      - uploads:/app/uploads

  worker:
    build:
      context: ./backend
      dockerfile: ../deploy/worker.Dockerfile
    command: celery -A autorubric.workers.celery_app worker -Q celery -l INFO
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/autorubric
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests/fixtures:/app/tests/fixtures
      - ./models:/app/models
      - uploads:/app/uploads

  gpu_worker:
    build:
      context: ./backend
      dockerfile: ../deploy/worker.Dockerfile
    command: celery -A autorubric.workers.celery_app worker -Q gpu_queue -c 1 -l INFO
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/autorubric
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests/fixtures:/app/tests/fixtures
      - ./models:/app/models
      - uploads:/app/uploads

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=autorubric
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads:
